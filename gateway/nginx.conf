# One public tunnel, routed by path:
#   /api/ -> api:7860   /local/ -> local:7860   /grafana/ -> grafana:3000
# ngrok's free plan has a single dev domain per account, so three tunnels would collide.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# gr.LoginButton always uses /login/... and /logout at the domain root. Both
# containers share the same session secret, so either one can handle the login;
# the Referer decides which product the user is sent back to.
map $http_referer $login_target {
    ~/local/ /local/;
    ~/api/   /api/;
    default  /;
}

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 600s;

    location = / {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>Blackjack Tutor</title>
<body style="font-family:sans-serif;max-width:40em;margin:3em auto;padding:0 1em">
<h1>Blackjack Tutor &mdash; CS553 Case Study 3</h1><ul>
<li><a href="api/">API product</a> (Hugging Face Inference API)</li>
<li><a href="local/">Local product</a> (Qwen3-0.6B on CPU)</li>
<li><a href="grafana/">Grafana dashboard</a> (read-only)</li></ul></body>';
    }

    location = /api     { return 301 $fwd_proto://$host/api/; }
    location = /local   { return 301 $fwd_proto://$host/local/; }
    location = /grafana { return 301 $fwd_proto://$host/grafana/; }

    location = /login/huggingface {
        return 302 $fwd_proto://$host/login/callback?_target_url=$login_target;
    }
    location = /login/callback {
        set $up_login api:7860;
        proxy_pass http://$up_login;
    }
    location = /logout {
        set $up_login api:7860;
        proxy_pass http://$up_login/logout?_target_url=$login_target;
    }

    location /api/ {
        set $up_api api:7860;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$up_api;
    }
    location /local/ {
        set $up_local local:7860;
        rewrite ^/local/(.*)$ /$1 break;
        proxy_pass http://$up_local;
    }
    location /grafana/ {
        set $up_grafana grafana:3000;
        proxy_pass http://$up_grafana;
    }
}
