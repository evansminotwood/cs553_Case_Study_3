global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: blackjack_app
    static_configs:
      - targets: ['api:8000']
        labels: { product: api }
      - targets: ['local:8000']
        labels: { product: local }

  - job_name: node_exporter
    static_configs:
      - targets: ['api:9100']
        labels: { product: api }
      - targets: ['local:9100']
        labels: { product: local }

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
